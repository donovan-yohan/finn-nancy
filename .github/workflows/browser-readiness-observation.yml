name: browser readiness observation

# One observational VM, no differential and no shipping/release check changes.
on:
  push:
    branches:
      - ci/browser-readiness-io

permissions:
  contents: read

jobs:
  observe:
    name: unchanged private-session readiness trace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install locked test tools
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync locked dependencies
        run: uv sync --frozen --group dev --group mcp
      - name: Preserve original general prelude before first Chrome
        env:
          PYTHON_DOTENV_DISABLED: "1"
        run: ./scripts/test --ignore=tests/test_ui_theme_browser.py
      - name: Observe original journeys once without retry or warmup
        env:
          CHROMIUM_BIN: /usr/bin/google-chrome
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          test -x "$CHROMIUM_BIN"
          "$CHROMIUM_BIN" --version
          command -v dbus-run-session
          command -v dbus-daemon
          export TMPDIR="$RUNNER_TEMP"
          .venv/bin/python tests/diagnostics/readiness-probe.py --root "$PWD" --output "$RUNNER_TEMP/readiness-observation"
      - name: Retain generated observations on every outcome
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-readiness-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/readiness-observation/*.json
            ${{ runner.temp }}/readiness-observation/*.xml
            ${{ runner.temp }}/readiness-observation/*/startup.json
            ${{ runner.temp }}/readiness-observation/*/chrome.stderr.log
          if-no-files-found: warn
          retention-days: 3
