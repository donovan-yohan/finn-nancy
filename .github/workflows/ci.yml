name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev --group mcp

      - name: Public-release privacy audit
        run: ./scripts/public-release-audit

      - name: Agentic delivery contract
        run: ./scripts/agentic-harness

      - name: Lint and syntax
        run: ./scripts/lint

      - name: Test
        run: ./scripts/test

      - name: FN-149 deterministic precision contract
        run: ./scripts/reconciliation-eval

      - name: FN-149B descriptor-resolution precision contract
        run: ./scripts/descriptor-resolution-eval

      - name: Build
        run: ./scripts/build

      - name: Isolated process and API smoke
        run: ./scripts/smoke
