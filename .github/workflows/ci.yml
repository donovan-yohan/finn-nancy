name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: deterministic harness
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync locked dependencies
        run: uv sync --frozen --group dev --group mcp

      - name: Public-release privacy audit
        run: ./scripts/public-release-audit

      - name: Agentic delivery contract
        run: ./scripts/agentic-harness

      - name: Lint and syntax
        run: ./scripts/lint

      - name: Test
        run: |
          ./scripts/test --ignore=tests/test_ui_theme_browser.py
          # Scope packaged Chrome to the three theme scenarios; retain other browser opt-ins.
          # Its installed path has Ubuntu's sandbox policy, unlike the unpacked Chromium snapshot.
          export CHROMIUM_BIN=/usr/bin/google-chrome
          test -x "$CHROMIUM_BIN"
          "$CHROMIUM_BIN" --version
          uv run --frozen python - <<'PY'
          import os
          import pathlib
          import shutil
          binary = os.environ.get("CHROMIUM_BIN") or shutil.which("chromium")
          print("Theme browser:", binary, "resolved:", os.path.realpath(binary) if binary else None, flush=True)
          print("Kernel:", os.uname().release, flush=True)
          policy = pathlib.Path("/proc/sys/kernel/apparmor_restrict_unprivileged_userns")
          print("AppArmor unprivileged-userns restriction:", policy.read_text().strip() if policy.exists() else "unavailable", flush=True)
          PY
          ./scripts/test tests/test_ui_theme_browser.py

      - name: FN-149 deterministic precision contract
        run: ./scripts/reconciliation-eval

      - name: FN-149B descriptor-resolution precision contract
        run: ./scripts/descriptor-resolution-eval

      - name: Build
        run: ./scripts/build

      - name: Isolated process and API smoke
        run: ./scripts/smoke
