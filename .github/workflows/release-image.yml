name: release image

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      review_receipt_sha256:
        description: Attest independent PASS receipt verified against final PR head and tree; full lowercase SHA256
        required: true
        type: string
      reviewed_pr_head:
        description: Full lowercase final merged PR head SHA verified in that receipt (not squash SHA)
        required: true
        type: string
      reviewed_pr_tree:
        description: Full lowercase reviewed PR Git tree SHA; must equal selected main tree
        required: true
        type: string
      source_sha:
        description: Full lowercase SHA of current reviewed main with successful main push CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || inputs.source_sha }}
  REVIEW_RECEIPT_SHA256: ${{ inputs.review_receipt_sha256 }}
  REVIEWED_PR_HEAD: ${{ inputs.reviewed_pr_head }}
  REVIEWED_PR_TREE: ${{ inputs.reviewed_pr_tree }}
  RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}

jobs:
  qualify:
    if: >-
      github.ref == 'refs/heads/main' && github.workflow_sha == github.sha &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_sha == github.sha &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Check out trusted dispatch revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify exact main and smoke actual native amd64 image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          test "$(uname -m)" = x86_64
          python3 scripts/release-image qualify --revision "$SOURCE_SHA" --artifacts "$RUNNER_TEMP/qualified-image"
      - name: Transfer only this run's qualified image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Retain qualification diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-qualification-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-image/*.json
            ${{ runner.temp }}/qualified-image/*.log
            ${{ runner.temp }}/qualified-image/smoke/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: qualify
    if: github.ref == 'refs/heads/main' && github.sha == (github.event.workflow_run.head_sha || inputs.source_sha) && github.workflow_sha == github.sha
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      pull-requests: read
      packages: write
    steps:
      - name: Check out trusted publication helper
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download qualified bytes from this run only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-image
      - name: Publish and read back exact digest
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          export TMPDIR="$RUNNER_TEMP"
          test "$(uname -m)" = x86_64
          python3 scripts/release-image publish --revision "$SOURCE_SHA" --artifacts "$RUNNER_TEMP/qualified-image"
      - name: Retain publication and registry readback receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-publication-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-image/*.json
            ${{ runner.temp }}/qualified-image/*.log
            ${{ runner.temp }}/qualified-image/smoke/
          if-no-files-found: warn
          retention-days: 14

  announce:
    needs: publish
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: image-publication-receipts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipts
      - name: Publish environment-neutral release identity only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release_auto.py "$RUNNER_TEMP/receipts/publication.json" "$RUNNER_TEMP/public-receipt.json"
          gh release create "deploy-$SOURCE_SHA" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" --title "Qualified image $SOURCE_SHA" \
            --notes-file "$RUNNER_TEMP/public-receipt.json" --latest \
            "$RUNNER_TEMP/public-receipt.json#release.json"
