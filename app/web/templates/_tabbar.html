{% set pending = pending_action_count() %}
<nav class="tabbar" aria-label="primary">
  <a class="tab {% if active == 'home' %}is-active{% endif %}" href="/">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    <span>Home</span>
  </a>
  <a class="tab {% if active == 'activity' %}is-active{% endif %}" href="/activity">
    <svg viewBox="0 0 24 24"><path d="M3 12h4l3 8 4-16 3 8h4"/></svg>
    <span>Activity</span>
  </a>

  <div class="fab-slot">
    <details class="fab" name="nav-sheet">
      <summary class="fab-btn" aria-label="Add a transaction">
        <svg viewBox="0 0 24 24"><path d="M12 15V4"/><path d="m7 9 5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg>
      </summary>
      <div class="fab-menu">
        <div class="fab-form">
          <button class="fab-item" type="button" data-capture-picker data-input-id="capture-camera-input">
            <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.2"/></svg>
            <span>Take photo</span>
          </button>
          <input
            id="capture-camera-input"
            class="capture-file-input"
            type="file"
            name="files"
            accept="image/*"
            capture="environment"
            data-capture-input
            data-source="camera"
            data-intent="receipt"
          >
        </div>
        <div class="fab-form">
          <button class="fab-item" type="button" data-capture-picker data-input-id="capture-files-input">
            <svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/></svg>
            <span>Upload files</span>
          </button>
          <input
            id="capture-files-input"
            class="capture-file-input"
            type="file"
            name="files"
            accept="image/*,application/pdf"
            multiple
            data-capture-input
            data-source="file"
            data-intent="receipt"
          >
        </div>
        <noscript><a class="fab-item" href="/upload">Open upload page</a></noscript>
      </div>
    </details>
  </div>

  <a class="tab nancy-tab {% if active == 'insights' %}is-active{% endif %}" href="/insights">
    <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/></svg>
    <span>Insights</span>
  </a>

  <details class="more" name="nav-sheet">
    <summary class="tab {% if active in ['more', 'chat', 'goals', 'statements'] %}is-active{% endif %}" aria-label="More navigation">
      <span class="tab-icon">
        <svg viewBox="0 0 24 24"><path d="M5 12h.01"/><path d="M12 12h.01"/><path d="M19 12h.01"/></svg>
        {% if pending > 0 %}<span class="tab-badge">{{ pending }}</span>{% endif %}
      </span>
      <span>More</span>
    </summary>
    <div class="more-menu">
      <a class="fab-item more-item nancy-link" href="/goals"><span>Goals</span></a>
      <a class="fab-item more-item nancy-link" href="/chat"><span>Ask Nancy</span></a>
      <a class="fab-item more-item" href="/processing"><span>Processing</span><span id="processing-nav-count" class="menu-count" hidden></span></a>
      <a class="fab-item more-item" href="/statements"><span>Statements</span></a>
      <a class="fab-item more-item" href="/actions">
        <span>Approvals</span>
        {% if pending > 0 %}<span class="menu-count">{{ pending }}</span>{% endif %}
      </a>
      <a class="fab-item more-item" href="/close"><span>Monthly close</span></a>
      <a class="fab-item more-item" href="/recon"><span>Reconcile</span></a>
      <a class="fab-item more-item" href="/review"><span>Review inbox</span></a>
      <a class="fab-item more-item" href="/backlog"><span>Uncategorized</span></a>
      <a class="fab-item more-item nancy-link" href="/categories"><span>Budget</span></a>
      <a class="fab-item more-item" href="/manage"><span>Manage</span></a>
    </div>
  </details>
</nav>
