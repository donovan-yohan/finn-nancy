<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script src="/static/theme.js"></script>
  <title>{% block title %}finn-nancy{% endblock %}</title>
  {% if not sandbox_candidate %}<link rel="manifest" href="/manifest.webmanifest">{% endif %}
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
  {% if not sandbox_candidate %}
  <script defer src="/static/capture-store.js"></script>
  <script defer src="/static/capture-outbox.js"></script>
  {% endif %}
</head>
<body class="app brand-{{ brand | default('shared') }}{% if sandbox_candidate %} sandbox-candidate{% else %} workspace-ui{% endif %}">
  <a class="skip-link" href="#workspace-content">Skip to content</a>
  <span class="theme-control" hidden>
    <label class="theme-label" for="appearance">Appearance</label>
    <select id="appearance" data-theme-select>
      <option value="system">System</option>
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
  </span>
  <main class="app-main" id="workspace-content" tabindex="-1">
    {% block content %}{% endblock %}
  </main>

  <!-- One transient upload notification; full status lives on /processing. -->
  <div id="toast" class="toast" aria-live="polite"></div>
  <div id="capture-announcer" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  {% include "_tabbar.html" %}

  <script>
    // Close the FAB speed-dial once an upload starts.
    document.body.addEventListener('htmx:afterOnLoad', function () {
      var open = document.querySelector('details.fab[open]');
      if (open) open.open = false;
    });

    // Bottom-bar sheets are mutually exclusive: opening one closes the other,
    // so the FAB speed-dial and the More menu can never overpaint each other.
    document.querySelectorAll('details[name="nav-sheet"]').forEach(function (d) {
      d.addEventListener('toggle', function () {
        if (!d.open) return;
        document.querySelectorAll('details[name="nav-sheet"]').forEach(function (other) {
          if (other !== d) other.open = false;
        });
      });
    });
  </script>
  {% if not sandbox_candidate %}<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
    }
  </script>{% endif %}
</body>
</html>
