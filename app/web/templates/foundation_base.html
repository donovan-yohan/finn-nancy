<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <script src="/static/theme.js"></script>
  <title>{% block title %}Finn Nancy{% endblock %}</title>
  {% if not sandbox_candidate %}<link rel="manifest" href="/manifest.webmanifest">{% endif %}
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/foundation/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="/static/foundation/tokens.css">
  <link rel="stylesheet" href="/static/foundation/components.css">
  {% block styles %}{% endblock %}
  <script src="/static/htmx.min.js"></script>
  {% if not sandbox_candidate %}
  <script defer src="/static/capture-store.js"></script>
  <script defer src="/static/capture-outbox.js"></script>
  {% endif %}
</head>
<body class="fn-app app brand-{{ brand | default('shared') }}{% if sandbox_candidate %} sandbox-candidate{% else %} workspace-ui{% endif %}">
  <a class="skip-link" href="#workspace-content">Skip to content</a>
  <header class="fn-header">
    <div class="fn-shell fn-header-inner">
      <a class="fn-wordmark" href="/" aria-label="Finn Nancy home"><span>Finn</span><span>Nancy</span></a>
      {% include '_tabbar.html' %}
      <div class="fn-appearance" data-theme-host>
        <div class="theme-control">
          <label class="form-label" for="appearance">Appearance</label>
          <select class="form-select" id="appearance" data-theme-select>
            <option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option>
          </select>
        </div>
      </div>
    </div>
  </header>
  <main class="fn-shell app-main" id="workspace-content" tabindex="-1">{% block content %}{% endblock %}</main>
  <!-- Transient feedback only. Durable capture status belongs to Processing. -->
  <div id="toast" aria-live="polite"></div>
  <div id="capture-announcer" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    document.body.addEventListener('htmx:afterOnLoad', function () {
      var open = document.querySelector('details.fab[open]');
      if (open) open.open = false;
    });
    document.querySelectorAll('details[name="nav-sheet"]').forEach(function (details) {
      details.addEventListener('toggle', function () {
        if (!details.open) return;
        document.querySelectorAll('details[name="nav-sheet"]').forEach(function (other) {
          if (other !== details) other.open = false;
        });
      });
    });
  </script>
  {% if not sandbox_candidate %}<script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', {scope:'/'}).catch(function () {});
    }
  </script>{% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
