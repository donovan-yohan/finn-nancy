{% extends "sandbox_shell.html" %}
{% set page_title = 'Activity' %}
{% block sandbox_content %}
<section class="sandbox-section sandbox-activity" aria-label="Activity">
  <form id="sandbox-filters" class="sandbox-filters" role="search">
    <div class="sandbox-activity-toolbar">
    <label class="sandbox-search"><span class="visually-hidden">Search activity</span><input class="form-control" name="q" type="search" placeholder="Search activity" maxlength="120"></label>
    <details id="sandbox-advanced-filters" class="sandbox-filter-details"><summary>Filters</summary><div class="sandbox-filter-grid">
    <label class="form-label">Connection owner<select class="form-select" id="owner-filter" name="owner_id"><option value="">Everyone</option></select></label>
    <label class="form-label">Connection<select class="form-select" name="connection_id"><option value="">All connections</option></select></label>
    <label class="form-label">Account<select class="form-select" name="account_id"><option value="">All accounts</option></select></label>
    <label class="form-label">From<input class="form-control" name="date_from" type="date"></label>
    <label class="form-label">To<input class="form-control" name="date_to" type="date"></label>
    <label class="form-label">Status<select class="form-select" name="state"><option value="current">Current</option><option value="posted">Posted</option><option value="pending">Pending</option><option value="removed">Removed</option><option value="superseded">Superseded</option><option value="all">All statuses</option></select></label>
    <label class="form-label">Inclusion<select class="form-select" name="inclusion"><option value="all">All accounts</option><option value="selected">Included</option><option value="excluded">Excluded</option></select></label>
    </div></details>
    <button class="btn btn-primary" type="submit">Apply</button><a class="btn btn-link" href="/activity">Reset</a>
    </div>
  </form>
  <p id="sandbox-result-count" class="fn-muted" role="status">Loading activity…</p>
  <div class="sandbox-column-head" aria-hidden="true"><span class="sandbox-merchant">Merchant</span><span class="sandbox-account-label">Account</span><span class="sandbox-date">Date</span><span class="sandbox-state">Status</span><span class="sandbox-money">Signed amount</span><span class="sandbox-chevron"></span></div>
  <div id="sandbox-staged" class="sandbox-list" aria-live="polite"></div>
  <nav class="sandbox-actions sandbox-pagination" aria-label="Activity pages">
    <button id="sandbox-previous" class="btn btn-outline-secondary" type="button" disabled>Previous</button>
    <span id="sandbox-page-status" class="fn-muted"></span>
    <button id="sandbox-next" class="btn btn-outline-secondary" type="button" disabled>Next</button>
  </nav>
</section>
{% endblock %}
