[project]
name = "finn-nancy"
version = "0.1.0"
description = "Experimental local-first personal finance application."
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
keywords = ["finance", "local-first", "sqlite"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    # web / portal
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "websockets>=15,<16",
    "watchdog>=4.0",
    # config / typing
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    # ingestion + LLM (M1)
    "langchain-openai>=1.6.2",
    "langchain-core>=1.6.3",
    "pillow>=10.3",
    "pillow-heif>=0.16",
    "filetype>=1.2",
    "tenacity>=8.3",
    "pymupdf>=1.24",
    "rapidfuzz>=3.9",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
]

# Core includes M6 chat dependencies. Spike-only experiments stay in the spike group.

[project.scripts]
fn = "app.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
mcp = ["mcp>=1.2"]
spike = [
    "deepagents==0.6.12",
    "langchain==1.3.11",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
